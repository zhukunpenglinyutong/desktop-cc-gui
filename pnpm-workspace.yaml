packages:
  - "packages/*"

# Supply-chain hardening (react-doctor/require-pnpm-hardening).
# Delay installs of package versions published less than 7 days ago so
# malicious releases can be caught and unpublished before we pick them up.
minimumReleaseAge: 10080

# @codemirror/state 6.7.4 是 lockfile 现行锁定版本（node_modules 已在用），
# 但它发布于 7 天门槛之内：一旦 workspace 变动触发重解析，年龄门就会拒绝
# 这个"早已安装"的版本。排除它让重解析复用既有锁定；no-downgrade 信任
# 策略仍然生效。后续升级该包时仍是人工审查动作。
minimumReleaseAgeExclude:
  - "@codemirror/*"

patchedDependencies:
  # Reorder auto-scroll (motion 12.23+) is opt-in via data-reorder-autoscroll;
  # default off — edge scrolling fights the drag offset and stutters upward drags.
  framer-motion@12.43.0: patches/framer-motion@12.43.0.patch
  # Drop the GFM email-literal lookbehind: Safari/WKWebView < 16.4 cannot parse
  # lookbehind and throws `invalid group specifier name` on the first Markdown
  # render, crashing the whole app. `findEmail` re-checks the previous character,
  # so behavior is unchanged. See patches/mdast-util-gfm-autolink-literal@2.0.1.patch.
  mdast-util-gfm-autolink-literal@2.0.1: patches/mdast-util-gfm-autolink-literal@2.0.1.patch

# Refuse resolutions whose trust signals (provenance/signatures) weaken
# between updates.
trustPolicy: no-downgrade
