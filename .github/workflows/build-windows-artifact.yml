name: Build Windows artifact

on:
  # A full Windows Tauri build costs 20–40 min of runner time — only run
  # manually via workflow_dispatch when an artifact is actually needed.
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: SDK contract typecheck
        run: pnpm --filter @ccgui/plugin-sdk typecheck

      - name: Frontend tests
        run: pnpm exec vitest run src

      # The computer-use Windows dependencies make the test EXEs fail at
      # process load on windows-latest (0xc0000139), before any test runs, and
      # this step gates packaging — so Windows coverage stays compile-only.
      # Includes the integration targets (src-tauri/tests/*) so send-path
      # signature drift fails here rather than in the bundle step.
      - name: Rust test compilation
        run: cargo test --manifest-path src-tauri/Cargo.toml --tests --no-run

      - name: Disable updater signing for artifact build
        shell: pwsh
        run: |
          $path = "src-tauri/tauri.conf.json"
          $config = Get-Content $path -Raw | ConvertFrom-Json
          $config.bundle.createUpdaterArtifacts = $false
          $config | ConvertTo-Json -Depth 20 | Set-Content $path

      - name: Build unsigned Windows installer
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm exec tauri build --config src-tauri/tauri.windows.conf.json --bundles nsis --no-sign

      - uses: actions/upload-artifact@v4
        with:
          name: ccgui-windows-x64
          path: |
            src-tauri/target/release/ccgui-next.exe
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
