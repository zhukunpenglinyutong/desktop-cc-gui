[package]
name = "ccgui-next"
version = "1.0.0"
description = "CC GUI - multi-CLI AI chat desktop"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "ccgui_next_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
regex = "1"
toml = "0.8"
toml_edit = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["rt", "macros", "net", "process", "time", "sync", "io-util"] }
sha2 = "0.10"
dirs = "6"
dunce = "1"
git2 = "0.20"
# Feature-unify openssl-sys to "vendored": git2 → libgit2-sys/libssh2-sys otherwise
# dynamically links Homebrew's libssl/libcrypto (e.g. libssl.4.dylib), which crashes
# the shipped .app at launch on any machine without that exact Homebrew install.
openssl-sys = { version = "0.9", features = ["vendored"] }
trash = "5"
# .gitignore-aware directory walking for the @-mention file index.
ignore = "0.4"
uuid = { version = "1", features = ["v4"] }
parking_lot = "0.12"
base64 = "0.22"
zstd = "0.13"
which = "7"
# PTY for the integrated terminal panel.
portable-pty = "0.8"
sysinfo = "0.36.1"
libc = "0.2"
# LAN web access: serves the built frontend and bridges the command/event
# surface over a token-authenticated WebSocket (see src/web.rs).
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
# DSH host session streams (ws:// loopback mux) plus the outbound relay, which
# dials the Cloudflare Worker over wss:// — hence the TLS feature.
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
serde_yaml = "0.9"
# Linux-native Baidu Tongji transport: fixed hm.js fetch + hm.gif beacon with
# rustls so it never touches the vendored-openssl stack or WebKit networking.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "multipart", "json"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[profile.release]
# Unwind (not abort): a panicking thread must still run destructors so engine
# child processes get reaped instead of leaked.
codegen-units = 1
lto = "thin"
opt-level = "z"
strip = true
